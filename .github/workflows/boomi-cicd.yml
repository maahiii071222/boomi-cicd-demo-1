name: Deploy Boomi Processes

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-boomi:
    name: Deploy Changed Boomi Processes
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find Changed Boomi Processes
        id: changed
        run: |
          set -e

          echo "Detecting changed Boomi processes..."

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find boomi-components \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name "process.xml" \
              -printf '%h\n' \
              | sort -u \
              > changed-processes.txt
          else
            git diff \
              --name-only \
              HEAD^ HEAD \
              -- 'boomi-components/*/process.xml' \
              > changed-files.txt

            if [ ! -s changed-files.txt ]; then
              echo "No Boomi process changes found."
              exit 0
            fi

            awk -F/ '
              NF >= 3 && $1 == "boomi-components" {
                print $1 "/" $2
              }
            ' changed-files.txt \
            | sort -u \
            > changed-processes.txt
          fi

          echo ""
          echo "Changed processes:"
          cat changed-processes.txt

      - name: Deploy Changed Processes
        if: hashFiles('changed-processes.txt') != ''
        env:
          BOOMI_API_BASE_URL: ${{ secrets.BOOMI_API_BASE_URL }}
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_ENVIRONMENT_ID: ${{ secrets.BOOMI_ENVIRONMENT_ID }}
        run: |
          set -e

          if [[ "${BOOMI_USERNAME}" == BOOMI_TOKEN.* ]]; then
            BOOMI_AUTH_USER="${BOOMI_USERNAME}"
          else
            BOOMI_AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"
          fi

          while IFS= read -r PROCESS_DIR; do

            COMPONENT_ID=$(basename "$PROCESS_DIR")

            PROCESS_NAME="Unknown"

            if [ -f "$PROCESS_DIR/component-name.txt" ]; then
              PROCESS_NAME=$(cat "$PROCESS_DIR/component-name.txt")
            fi

            VERSION="Unknown"

            if [ -f "$PROCESS_DIR/version.txt" ]; then
              VERSION=$(cat "$PROCESS_DIR/version.txt")
            fi

            echo ""
            echo "======================================"
            echo "Deploying Boomi Process"
            echo "======================================"
            echo "Process   : $PROCESS_NAME"
            echo "Component : $COMPONENT_ID"
            echo "Revision  : $VERSION"
            echo "Environment: $BOOMI_ENVIRONMENT_ID"
            echo "======================================"

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --user "${BOOMI_AUTH_USER}:${BOOMI_API_TOKEN}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --request POST \
              --data "{
                \"environmentId\": \"${BOOMI_ENVIRONMENT_ID}\",
                \"componentId\": \"${COMPONENT_ID}\",
                \"notes\": \"GitHub Actions deployment - ${PROCESS_NAME} - revision ${VERSION}\"
              }" \
              "${BOOMI_API_BASE_URL}/${BOOMI_ACCOUNT_ID}/DeployedPackage")

            echo ""
            echo "Boomi deployment response:"
            echo "$RESPONSE"

            echo "$RESPONSE" > \
              "${PROCESS_DIR}/deployment-response.json"

            echo ""
            echo "Deployment completed for:"
            echo "$PROCESS_NAME"

          done < changed-processes.txt

      - name: Deployment Summary
        run: |
          echo "## Boomi Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f changed-processes.txt ]; then
            echo "| Process | Component ID |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r PROCESS_DIR; do

              COMPONENT_ID=$(basename "$PROCESS_DIR")

              if [ -f "$PROCESS_DIR/component-name.txt" ]; then
                PROCESS_NAME=$(cat "$PROCESS_DIR/component-name.txt")
              else
                PROCESS_NAME="Unknown"
              fi

              echo "| $PROCESS_NAME | $COMPONENT_ID |" \
                >> "$GITHUB_STEP_SUMMARY"

            done < changed-processes.txt
          else
            echo "No Boomi process changes detected." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
